<style>@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.f-SG{font-family:'Space Grotesk',sans-serif;font-weight:700}.f-IN{font-family:'Inter',sans-serif}.f-JB{font-family:'JetBrains Mono',monospace;font-weight:500}.f-IS{font-family:'Instrument Serif',serif;font-style:italic}
